  fecha_consulta: '2026-11-09'
  texto_citado: 'Las Unidades de Organización que, a la entrada en vigencia de la presente directiva,
    cuentan con software institucional desarrollado internamente que se encuentra en producción o cuyo
    desarrollo ha concluido, regularizan su adecuación a las disposiciones establecidas en la presente
    directiva, incluyendo su incorporación al repositorio institucional, documentación técnica, control
    de versiones, titularidad institucional, licenciamiento y demás requisitos aplicables. Para dicho
    efecto, remiten a la Sub Gerencia de Modernización y Transformación Digital, por intermedio de la
    Gerencia Regional de Planeamiento, Presupuesto y Acondicionamiento Territorial, en un plazo máximo
    de sesenta (60) días hábiles contados desde la entrada en vigencia de la presente directiva, el inventario
    del software institucional desarrollado internamente que se encuentra en producción o cuyo desarrollo
    ha concluido, acompañado de la siguiente información y documentación, según corresponda:'
