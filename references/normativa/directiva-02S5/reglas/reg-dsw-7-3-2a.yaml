  archivo_paginas: v1.0/originales/directiva-02S5-v1.0-sgd-7501018.pdf
  sha256_paginas: 668f255cd808388a40ab42be96843325cbf86d0fd39938778d655cd80ba63464
  numeral: 7.3.2 a)
  pagina_pdf: '11'
  fecha_consulta: '2026-11-09'
  texto_citado: 'Se considera versión mayor (X) todo cambio que: (i) afecta la compatibilidad de funcionalidades,
    integraciones o procesos existentes; (ii) modifica la arquitectura, el motor de base de datos o las
    medidas estructurales de seguridad de la información o protección de datos personales; o (iii) incorpora
    un módulo, flujo de trabajo o funcionalidad que no forma parte del alcance previamente aprobado del
    software, independientemente de su extensión. Se considera versión menor (Y) toda extensión, mejora
    o ampliación de una funcionalidad ya existente que no genera los efectos señalados en los literales
    precedentes.'
