  texto_citado: Las Unidades de Organización, para el control de las versiones, emplean la estructura
    “Mayor.Menor.Corrección (X.Y.Z)”, lo que permite mantener la trazabilidad de los cambios realizados.
    La versión mayor (X) identifica cambios significativos, nuevas funcionalidades o liberaciones relevantes
    del software. La versión menor (Y) identifica mejoras funcionales, ampliaciones o modificaciones compatibles
    con la versión principal. La versión de corrección (Z) identifica ajustes, correcciones de errores
    o cambios menores que no modifican la funcionalidad principal.
