regla_de_citacion: >-
  Las reglas citan el texto literal del .docx (texto-de-referencia) y la página del PDF
  7501018. Desde el 2026-11-16 registran además la página del PDF firmado
  (pagina_pdf_oficial), que es la que se cita en documentos dirigidos a la entidad. Si el
  pasaje difiere entre archivos, prevalece el PDF firmado y la regla lo registra en
  "observaciones".
