  fecha_consulta: '2026-11-09'
  texto_citado: 'Tratándose de software institucional que constituye una solución independiente y completa:
    Documentación mínima establecida en el Anexo N°04, en su integridad. Control de versiones y trazabilidad
    de cambios. Matriz de dependencias, librerías y componentes utilizados, conforme al Anexo N°03. Determinación
    del licenciamiento aplicable, mediante el informe técnico correspondiente. Incorporación de glosas
    de licencia, cuando corresponda. Incorporación del archivo "LICENCIA.txt", cuando corresponda. Referencias
    de licencia en el código fuente, cuando corresponda. Verificación definitiva de la titularidad institucional
    o acreditación de derechos patrimoniales. Implementación de medidas de seguridad de la información
    y protección de datos personales. Incorporación al repositorio institucional, conforme al numeral
    7.1.'
