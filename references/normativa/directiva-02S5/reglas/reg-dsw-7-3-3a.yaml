  texto_citado: La determinación de la licencia aplicable al software se sustenta mediante un informe
    técnico elaborado considerando la matriz comparativa de licencias libres y abiertas establecida en
    el Anexo N°05. Dicha matriz puede ser actualizada mediante documento técnico complementario por la
    Sub Gerencia de Modernización y Transformación Digital, cuando existan nuevas licencias, modificaciones
    relevantes, nuevos criterios técnicos o necesidades institucionales debidamente sustentadas.
