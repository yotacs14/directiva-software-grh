  fecha_consulta: '2026-11-09'
  texto_citado: 'Determinada la aplicación de una licencia libre o abierta al software institucional,
    las Unidades de Organización aseguran el cumplimiento de lo siguiente: […] c) Todos los archivos fuente
    incorporan comentarios, notas, encabezados u otros mecanismos equivalentes que identifican la licencia
    aplicable o remiten expresamente al archivo "LICENCIA.txt".'
