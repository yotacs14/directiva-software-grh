    "APROBAR, la Directiva N° 02.S5.DI.SGMTD - V1.0 [...]". El PDF lleva 3 firmas digitales
    (21/09/2026 12:45, 12:51 y 13:04); los firmantes no se pudieron leer con las herramientas
    disponibles. (Corregido el 2026-11-16: el primer registro indicó por error "sin firma".)
    La directiva firmada (v1.0/originales/directiva-02S5-v1.0-firmada.pdf) lleva 4 firmas
    digitales (16/09/2026 13:03; 18/09/2026 10:52, 10:53 y 11:09); los firmantes no se
    pudieron leer con las herramientas disponibles.
  antecedente: >-
    El PDF SGD 7501018 (versión de julio) lleva dos firmas digitales: formulador (GODOY
    GOICOCHEA Kevin Steven, 22/07/2026) y conformidad del Sub Gerente de la SGMTD (AGUIRRE
    TELLO Walther Raul Ii Benjamin, 24/07/2026).

vigencia:
  estado: VIGENTE
  fecha_desde: "2026-09-22"
  fuente: >-
    Numeral 10.1: "La presente directiva entra en vigencia a partir del día siguiente de su
    aprobación mediante el acto resolutivo correspondiente." Aprobación: 21/09/2026.
  nota: >-
    Plazo del numeral 11.1 (60 días hábiles desde la entrada en vigencia): vence alrededor del
    17 o 18 de diciembre de 2026, según se cuente o no el 22/09/2026 y considerando feriados
    nacionales (08/10, 08/12, 09/12). Días no laborables que se declaren después lo
    desplazan. Cómputo exacto POR-CONFIRMAR con la SGMTD.

