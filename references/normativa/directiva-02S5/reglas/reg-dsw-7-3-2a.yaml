esquema: regla-normativa-v1+dsw
id_regla: REG-DSW-7.3.2a
titulo: Criterios de versión mayor y menor
dominio: directiva-software-grh
tipo_regla: DEFINICION
enunciado: Es versión mayor todo cambio que afecta la compatibilidad, modifica arquitectura, motor de
  base de datos o medidas estructurales de seguridad, o incorpora funcionalidad fuera del alcance aprobado;
  las demás extensiones de funcionalidad existente son versión menor.
